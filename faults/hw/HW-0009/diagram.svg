  <g fill="#7d8590" font-size="9">
    <text x="526" y="52">u1</text>
    <text x="526" y="76">u2</text>
    <text x="526" y="232">u1</text>
    <text x="526" y="256">u2</text>
    <text x="1086" y="142">u1</text>
