<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="44" width="210" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="117" y="63" text-anchor="middle" fill="#1e3a8a">zone_clg_request</text>
    <rect x="12" y="154" width="210" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="117" y="173" text-anchor="middle" fill="#1e3a8a">satisfied_zone_fraction</text>
  </g>

  <!-- threshold blocks -->
  <g>
    <rect x="250" y="30" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="375" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">reqMax</text>
    <text x="375" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 99 %</text>

    <rect x="250" y="140" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="375" y="162" text-anchor="middle" fill="#24292f" font-weight="bold">mostHappy</text>
    <text x="375" y="180" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 0.8</text>
  </g>

  <!-- conjunction -->
  <rect x="560" y="85" width="110" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="615" y="107" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
  <text x="615" y="125" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- duration then alarm delay -->
  <rect x="730" y="85" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="820" y="107" text-anchor="middle" fill="#24292f" font-weight="bold">rogue</text>
  <text x="820" y="125" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <rect x="950" y="85" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1040" y="107" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1040" y="125" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1180" y="99" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1220" y="118" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 222 59 H 246"/>
    <path d="M 222 169 H 246"/>

    <path d="M 500 59 H 530 V 99 H 556"/>
    <path d="M 500 169 H 530 V 129 H 556"/>

    <path d="M 670 114 H 726"/>
    <path d="M 910 114 H 946"/>
    <path d="M 1130 114 H 1176"/>
  </g>

  <!-- signal type hints -->
  <text x="228" y="38" fill="#7d8590" font-size="10">Real</text>
  <text x="510" y="52" fill="#7d8590" font-size="10">Bool</text>
</svg>
