<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="54" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="73" text-anchor="middle" fill="#1e3a8a">zone_airflow</text>

  <rect x="12" y="264" width="170" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="97" y="283" text-anchor="middle" fill="#1e3a8a">zone_airflow_sp</text>

  <!-- tracking-error chain -->
  <g>
    <rect x="210" y="40" width="140" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="280" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">err</text>
    <text x="280" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="390" y="40" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="450" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">absErr</text>
    <text x="450" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

    <rect x="550" y="40" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="615" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">ratio</text>
    <text x="615" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Divide</text>

    <rect x="720" y="40" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">ratioHigh</text>
    <text x="835" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 0.30</text>
  </g>

  <!-- evaluability branch -->
  <g>
    <rect x="720" y="250" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="845" y="272" text-anchor="middle" fill="#24292f" font-weight="bold">spOk</text>
    <text x="845" y="290" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 50 L/s</text>
  </g>

  <!-- gate and alarm chain -->
  <g>
    <rect x="1140" y="40" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1205" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">gate</text>
    <text x="1205" y="80" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="1310" y="40" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1400" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">track</text>
    <text x="1400" y="80" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

    <rect x="1530" y="40" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1620" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="1620" y="80" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 300 s</text>
  </g>

  <!-- boundary outputs -->
  <rect x="1750" y="54" width="110" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1805" y="73" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <rect x="1730" y="264" width="150" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1805" y="283" text-anchor="middle" fill="#7f1d1d">ySetpointOk</text>

  <!-- fan-out junctions -->
  <circle cx="185" cy="279" r="3" fill="#7d8590"/>
  <circle cx="1010" cy="279" r="3" fill="#7d8590"/>
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 182 279 H 185"/>
    <path d="M 970 279 H 1010"/>
  </g>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 162 69 H 185 V 55 H 206"/>
    <path d="M 185 279 V 83 H 206"/>
    <path d="M 185 279 V 200 H 530 V 83 H 546"/>
    <path d="M 185 279 H 716"/>

    <path d="M 350 69 H 386"/>
    <path d="M 510 69 H 530 V 55 H 546"/>
    <path d="M 680 69 H 716"/>

    <path d="M 950 69 H 1100 V 55 H 1136"/>
    <path d="M 1010 279 V 83 H 1136"/>
    <path d="M 1010 279 H 1726"/>

    <path d="M 1270 69 H 1306"/>
    <path d="M 1490 69 H 1526"/>
    <path d="M 1710 69 H 1746"/>
  </g>

  <!-- port hints where operand order matters -->
  <g fill="#7d8590" font-size="9">
    <text x="214" y="53">u1</text>
    <text x="214" y="88">u2</text>
    <text x="554" y="53">u1</text>
    <text x="554" y="88">u2</text>
    <text x="1144" y="53">u1</text>
    <text x="1144" y="88">u2</text>
  </g>

  <!-- signal type hints -->
  <text x="130" y="110" fill="#7d8590" font-size="10">Real</text>
  <text x="956" y="56" fill="#7d8590" font-size="10">Bool</text>
  <text x="976" y="266" fill="#7d8590" font-size="10">Bool</text>
</svg>
