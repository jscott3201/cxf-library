<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="44" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="63" text-anchor="middle" fill="#1e3a8a">rht_vlv_cmd</text>
    <rect x="12" y="144" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="163" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="244" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="263" text-anchor="middle" fill="#1e3a8a">zone_dmpr_pos</text>
  </g>

  <!-- threshold blocks -->
  <g>
    <rect x="240" y="30" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="365" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">rhtOn</text>
    <text x="365" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 10 %</text>

    <rect x="240" y="130" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="365" y="152" text-anchor="middle" fill="#24292f" font-weight="bold">warmOut</text>
    <text x="365" y="170" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 18 °C</text>

    <rect x="240" y="230" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="365" y="252" text-anchor="middle" fill="#24292f" font-weight="bold">dmprMin</text>
    <text x="365" y="270" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 35 %</text>
  </g>

  <!-- conjunctions -->
  <rect x="550" y="80" width="110" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="605" y="102" text-anchor="middle" fill="#24292f" font-weight="bold">and1</text>
  <text x="605" y="120" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="720" y="155" width="110" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="775" y="177" text-anchor="middle" fill="#24292f" font-weight="bold">and2</text>
  <text x="775" y="195" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- duration then alarm delay -->
  <rect x="880" y="155" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="970" y="177" text-anchor="middle" fill="#24292f" font-weight="bold">hold</text>
  <text x="970" y="195" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <rect x="1120" y="155" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1210" y="177" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1210" y="195" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="1330" y="169" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1370" y="188" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 202 59 H 236"/>
    <path d="M 202 159 H 236"/>
    <path d="M 202 259 H 236"/>

    <path d="M 490 59 H 520 V 95 H 546"/>
    <path d="M 490 159 H 520 V 123 H 546"/>

    <path d="M 660 109 H 690 V 170 H 716"/>
    <path d="M 490 259 H 690 V 198 H 716"/>

    <path d="M 830 184 H 876"/>
    <path d="M 1060 184 H 1116"/>
    <path d="M 1300 184 H 1326"/>
  </g>

  <!-- signal type hints -->
  <text x="208" y="38" fill="#7d8590" font-size="10">Real</text>
  <text x="500" y="52" fill="#7d8590" font-size="10">Bool</text>
</svg>
