<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary input: the role point under adjudication -->
  <rect x="12" y="96" width="118" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="71" y="115" text-anchor="middle" fill="#1e3a8a">sensor_value</text>

  <!-- one sample of history -->
  <rect x="180" y="196" width="236" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="298" y="218" text-anchor="middle" fill="#24292f" font-weight="bold">prev</text>
  <text x="298" y="236" text-anchor="middle" fill="#57606a" font-size="11">Discrete.UnitDelay · 60 s</text>
  <text x="180" y="276" fill="#7d8590" font-size="10">y_start = 0 (default) — held until the 2nd sample instant</text>

  <!-- the step, unsigned -->
  <rect x="470" y="76" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="555" y="98" text-anchor="middle" fill="#24292f" font-weight="bold">step</text>
  <text x="555" y="116" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="690" y="76" width="150" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="765" y="98" text-anchor="middle" fill="#24292f" font-weight="bold">stepAbs</text>
  <text x="765" y="116" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

  <rect x="890" y="76" width="290" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1035" y="98" text-anchor="middle" fill="#24292f" font-weight="bold">tooFast</text>
  <text x="1035" y="116" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 10</text>
  <text x="890" y="156" fill="#7d8590" font-size="10">max_step_per_sample — per binding, in the bound point's units</text>

  <!-- startup inhibit: the artifact window is exactly one samplePeriod -->
  <rect x="180" y="316" width="270" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="315" y="338" text-anchor="middle" fill="#24292f" font-weight="bold">always</text>
  <text x="315" y="356" text-anchor="middle" fill="#57606a" font-size="11">Logical.Sources.Constant · k = true</text>

  <rect x="530" y="316" width="280" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="670" y="338" text-anchor="middle" fill="#24292f" font-weight="bold">historyOk</text>
  <text x="670" y="356" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 120 s · delayOnInit</text>
  <text x="530" y="396" fill="#7d8590" font-size="10">false for 2 × samplePeriod — the longest the y_start seed can survive a load</text>

  <rect x="1230" y="176" width="150" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1305" y="198" text-anchor="middle" fill="#24292f" font-weight="bold">gate</text>
  <text x="1305" y="216" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- boundary outputs -->
  <rect x="1440" y="190" width="81" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1480.5" y="209" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="1440" y="330" width="120" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="1500" y="349" text-anchor="middle" fill="#78350f">yHistoryOk</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 130 111 H 430 V 92 H 466"/>
    <path d="M 130 111 V 225 H 176"/>
    <path d="M 416 225 H 440 V 118 H 466"/>
    <path d="M 640 105 H 686"/>
    <path d="M 840 105 H 886"/>
    <path d="M 1180 105 H 1204 V 191 H 1226"/>
    <path d="M 450 345 H 526"/>
    <path d="M 810 345 H 1204 V 219 H 1226"/>
    <path d="M 810 345 H 1436"/>
    <path d="M 1380 205 H 1436"/>
  </g>

  <!-- signal type hints -->
  <text x="136" y="102" fill="#7d8590" font-size="10">Real</text>
  <text x="422" y="216" fill="#7d8590" font-size="10">Real</text>
  <text x="646" y="98" fill="#7d8590" font-size="10">Real</text>
  <text x="1186" y="96" fill="#7d8590" font-size="10">Bool</text>
  <text x="816" y="336" fill="#7d8590" font-size="10">Bool</text>
  <text x="1206" y="187" fill="#7d8590" font-size="9">u1</text>
  <text x="1206" y="231" fill="#7d8590" font-size="9">u2</text>
  <text x="1440" y="386" fill="#7d8590" font-size="11">false ⇒ NO_EVAL</text>
</svg>
