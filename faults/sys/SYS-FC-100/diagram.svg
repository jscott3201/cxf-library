  <text x="1650" y="109" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="1180" y="300" width="130" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="1245" y="319" text-anchor="middle" fill="#78350f">yWindowOk</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
