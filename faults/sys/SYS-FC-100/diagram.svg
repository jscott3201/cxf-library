    <path d="M 142 95 H 380 V 93 H 398"/>
    <path d="M 340 65 H 380 V 117 H 398"/>
    <path d="M 530 105 H 568"/>
    <path d="M 670 105 H 708"/>
    <path d="M 910 105 H 925 V 93 H 948"/>

    <path d="M 142 315 H 935 V 117 H 948"/>
