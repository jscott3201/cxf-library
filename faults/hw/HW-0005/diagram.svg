<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="38" width="152" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="88" y="57" text-anchor="middle" fill="#1e3a8a">hw_pump_vfd_speed</text>
  <rect x="12" y="200" width="52" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="38" y="219" text-anchor="middle" fill="#1e3a8a">oat</text>

  <!-- the pump is working hard -->
  <rect x="230" y="54" width="240" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="350" y="76" text-anchor="middle" fill="#24292f" font-weight="bold">pumpHigh</text>
  <text x="350" y="94" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 45 %</text>

  <!-- ...in weather that cannot justify it -->
  <rect x="230" y="186" width="258" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="359" y="208" text-anchor="middle" fill="#24292f" font-weight="bold">mildOat</text>
  <text x="359" y="226" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 15.6 °C</text>

  <rect x="560" y="120" width="104" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="612" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">gate</text>
  <text x="612" y="160" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="710" y="120" width="140" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="780" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">sustained</text>
  <text x="780" y="160" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <!-- boundary outputs -->
  <rect x="890" y="134" width="81" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="930.5" y="153" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="890" y="274" width="126" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="953" y="293" text-anchor="middle" fill="#78350f">yMildWeather</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 164 53 H 194 V 83 H 226"/>
    <path d="M 64 215 H 226"/>
    <path d="M 470 83 H 530 V 135 H 556"/>
    <path d="M 488 215 H 530 V 163 H 556"/>
    <path d="M 488 215 H 862 V 289 H 886"/>
    <path d="M 664 149 H 706"/>
    <path d="M 850 149 H 886"/>
  </g>

  <!-- signal type hints -->
  <text x="170" y="44" fill="#7d8590" font-size="10">Real</text>
  <text x="70" y="206" fill="#7d8590" font-size="10">Real</text>
  <text x="476" y="76" fill="#7d8590" font-size="10">Bool</text>
  <text x="494" y="208" fill="#7d8590" font-size="10">Bool</text>
  <text x="536" y="131" fill="#7d8590" font-size="9">u1</text>
  <text x="536" y="175" fill="#7d8590" font-size="9">u2</text>
  <text x="890" y="336" fill="#7d8590" font-size="11">false ⇒ NO_EVAL</text>
</svg>
