<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="34" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="53" text-anchor="middle" fill="#1e3a8a">sat</text>
    <rect x="12" y="104" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="123" text-anchor="middle" fill="#1e3a8a">sat_sp</text>
    <rect x="12" y="214" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="233" text-anchor="middle" fill="#1e3a8a">clg_vlv_cmd</text>
  </g>

  <!-- gap and threshold blocks -->
  <g>
    <rect x="190" y="50" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="72" text-anchor="middle" fill="#24292f" font-weight="bold">spGap</text>
    <text x="305" y="90" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract · sat − sat_sp</text>

    <rect x="470" y="50" width="240" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="590" y="72" text-anchor="middle" fill="#24292f" font-weight="bold">spMiss</text>
    <text x="590" y="90" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 1 °C</text>

    <rect x="470" y="200" width="240" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="590" y="222" text-anchor="middle" fill="#24292f" font-weight="bold">clgFull</text>
    <text x="590" y="240" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 99 %</text>
  </g>

  <!-- and block -->
  <rect x="760" y="125" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="820" y="147" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
  <text x="820" y="165" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="920" y="125" width="168" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1004" y="147" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1004" y="165" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary outputs -->
  <rect x="1120" y="139" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1154" y="158" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="920" y="214" width="95" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="967.5" y="233" text-anchor="middle" fill="#78350f">yClgFullOk</text>

  <!-- fan-out trunk -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 710 229 H 735"/>
  </g>
  <circle cx="735" cy="229" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 150 49 H 170 V 65 H 186"/>
    <path d="M 150 119 H 170 V 93 H 186"/>
    <path d="M 150 229 H 466"/>

    <path d="M 420 79 H 466"/>

    <path d="M 710 79 H 735 V 140 H 756"/>
    <path d="M 735 229 V 168 H 756"/>
    <path d="M 735 229 H 916"/>

    <path d="M 880 154 H 916"/>
    <path d="M 1088 154 H 1116"/>
  </g>

  <!-- port and signal hints -->
  <text x="176" y="62" fill="#7d8590" font-size="10">u1</text>
  <text x="176" y="106" fill="#7d8590" font-size="10">u2</text>
  <text x="158" y="28" fill="#7d8590" font-size="10">Real</text>
  <text x="722" y="72" fill="#7d8590" font-size="10">Bool</text>
  <text x="920" y="266" fill="#7d8590" font-size="11">false ⇒ NO_EVAL</text>
</svg>
