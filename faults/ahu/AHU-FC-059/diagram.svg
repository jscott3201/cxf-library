<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="34" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="53" text-anchor="middle" fill="#1e3a8a">htg_vlv_cmd</text>
    <rect x="12" y="164" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="183" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="294" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="313" text-anchor="middle" fill="#1e3a8a">clg_vlv_cmd</text>
  </g>

  <!-- threshold blocks -->
  <g>
    <rect x="190" y="20" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="42" text-anchor="middle" fill="#24292f" font-weight="bold">htgOpen</text>
    <text x="305" y="60" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5.0 %</text>

    <rect x="190" y="100" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="122" text-anchor="middle" fill="#24292f" font-weight="bold">oatWarm</text>
    <text x="305" y="140" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 18 °C</text>

    <rect x="190" y="200" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="222" text-anchor="middle" fill="#24292f" font-weight="bold">oatCold</text>
    <text x="305" y="240" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 10 °C</text>

    <rect x="190" y="280" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="302" text-anchor="middle" fill="#24292f" font-weight="bold">clgOpen</text>
    <text x="305" y="320" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5.0 %</text>
  </g>

  <!-- per-branch and blocks -->
  <g>
    <rect x="480" y="60" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="540" y="82" text-anchor="middle" fill="#24292f" font-weight="bold">htgMiss</text>
    <text x="540" y="100" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="480" y="240" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="540" y="262" text-anchor="middle" fill="#24292f" font-weight="bold">clgMiss</text>
    <text x="540" y="280" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  </g>

  <!-- or block -->
  <rect x="660" y="150" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="720" y="172" text-anchor="middle" fill="#24292f" font-weight="bold">anyMiss</text>
  <text x="720" y="190" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <!-- persistence -->
  <rect x="820" y="150" width="168" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="904" y="172" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="904" y="190" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1020" y="164" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1054" y="183" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- oat fan-out trunk -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 150 179 H 170"/>
  </g>
  <circle cx="170" cy="179" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 150 49 H 186"/>
    <path d="M 170 179 V 129 H 186"/>
    <path d="M 170 179 V 229 H 186"/>
    <path d="M 150 309 H 186"/>

    <path d="M 420 49 H 450 V 75 H 476"/>
    <path d="M 420 129 H 450 V 103 H 476"/>
    <path d="M 420 309 H 450 V 283 H 476"/>
    <path d="M 420 229 H 450 V 255 H 476"/>

    <path d="M 600 89 H 630 V 165 H 656"/>
    <path d="M 600 269 H 630 V 193 H 656"/>

    <path d="M 780 179 H 816"/>
    <path d="M 988 179 H 1018"/>
  </g>

  <!-- signal type hints -->
  <text x="158" y="28" fill="#7d8590" font-size="10">Real</text>
  <text x="432" y="42" fill="#7d8590" font-size="10">Bool</text>
</svg>
