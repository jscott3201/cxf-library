<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs: the two members of the pair, interchangeable -->
  <rect x="12" y="60" width="130" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="77" y="79" text-anchor="middle" fill="#1e3a8a">sensor_value_a</text>
  <rect x="12" y="150" width="130" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="77" y="169" text-anchor="middle" fill="#1e3a8a">sensor_value_b</text>

  <!-- signed difference, then the sign is thrown away -->
  <rect x="200" y="91" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="265" y="113" text-anchor="middle" fill="#24292f" font-weight="bold">diff</text>
  <text x="265" y="131" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="380" y="91" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="445" y="113" text-anchor="middle" fill="#24292f" font-weight="bold">absDiff</text>
  <text x="445" y="131" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

  <!-- threshold in the BOUND points' units -->
  <rect x="560" y="91" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="685" y="113" text-anchor="middle" fill="#24292f" font-weight="bold">driftHigh</text>
  <text x="685" y="131" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 2.0</text>

  <!-- the reference's two published delays, chained -->
  <rect x="860" y="91" width="160" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="940" y="113" text-anchor="middle" fill="#24292f" font-weight="bold">sustained</text>
  <text x="940" y="131" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <rect x="1070" y="91" width="160" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1150" y="113" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1150" y="131" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1280" y="105" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1314" y="124" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 142 75 H 172 V 105 H 196"/>
    <path d="M 142 165 H 172 V 135 H 196"/>
    <path d="M 330 120 H 376"/>
    <path d="M 510 120 H 556"/>
    <path d="M 810 120 H 856"/>
    <path d="M 1020 120 H 1066"/>
    <path d="M 1230 120 H 1276"/>
  </g>

  <!-- signal type hints -->
  <text x="148" y="66" fill="#7d8590" font-size="10">Real</text>
  <text x="148" y="156" fill="#7d8590" font-size="10">Real</text>
  <text x="176" y="101" fill="#7d8590" font-size="9">u1</text>
  <text x="176" y="145" fill="#7d8590" font-size="9">u2</text>
  <text x="336" y="113" fill="#7d8590" font-size="10">Real</text>
  <text x="516" y="113" fill="#7d8590" font-size="10">Real</text>
  <text x="816" y="113" fill="#7d8590" font-size="10">Bool</text>
  <text x="1026" y="113" fill="#7d8590" font-size="10">Bool</text>

  <text x="200" y="212" fill="#7d8590" font-size="11">absDiff throws the sign away: a high and b high are the same output</text>
  <text x="200" y="232" fill="#7d8590" font-size="11">adjudicates sensor_value_a + sensor_value_b · verdict ambiguous</text>
</svg>
