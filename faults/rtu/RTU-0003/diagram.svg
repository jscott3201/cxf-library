<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1990 600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="60" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="79" text-anchor="middle" fill="#1e3a8a">sat</text>
  <rect x="12" y="140" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="159" text-anchor="middle" fill="#1e3a8a">mat</text>
  <rect x="12" y="380" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="399" text-anchor="middle" fill="#1e3a8a">comp_status</text>
  <rect x="12" y="470" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="72" y="489" text-anchor="middle" fill="#1e3a8a">htg_status</text>

  <!-- temperature differences -->
  <rect x="200" y="60" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="275" y="80" text-anchor="middle" fill="#24292f" font-weight="bold">devSM</text>
  <text x="275" y="98" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="200" y="250" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="275" y="270" text-anchor="middle" fill="#24292f" font-weight="bold">devMS</text>
  <text x="275" y="288" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <!-- idle branch -->
  <rect x="420" y="20" width="130" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="485" y="40" text-anchor="middle" fill="#24292f" font-weight="bold">absDev</text>
  <text x="485" y="58" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

  <rect x="620" y="20" width="240" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="740" y="40" text-anchor="middle" fill="#24292f" font-weight="bold">idleDev</text>
  <text x="740" y="58" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 3 °C</text>

  <rect x="970" y="20" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1045" y="40" text-anchor="middle" fill="#24292f" font-weight="bold">idleViol</text>
  <text x="1045" y="58" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- cooling branch -->
  <rect x="620" y="150" width="240" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="740" y="170" text-anchor="middle" fill="#24292f" font-weight="bold">coolDir</text>
  <text x="740" y="188" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 1 °C</text>

  <rect x="970" y="150" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1045" y="170" text-anchor="middle" fill="#24292f" font-weight="bold">coolViol</text>
  <text x="1045" y="188" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- heating branch -->
  <rect x="620" y="250" width="240" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="740" y="270" text-anchor="middle" fill="#24292f" font-weight="bold">htgDir</text>
  <text x="740" y="288" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 1 °C</text>

  <rect x="970" y="250" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1045" y="270" text-anchor="middle" fill="#24292f" font-weight="bold">htgViol</text>
  <text x="1045" y="288" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- idle state -->
  <rect x="200" y="370" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="275" y="390" text-anchor="middle" fill="#24292f" font-weight="bold">notComp</text>
  <text x="275" y="408" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="200" y="460" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="275" y="480" text-anchor="middle" fill="#24292f" font-weight="bold">notHtg</text>
  <text x="275" y="498" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="420" y="415" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="495" y="435" text-anchor="middle" fill="#24292f" font-weight="bold">idle</text>
  <text x="495" y="453" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- disjunction + persistence -->
  <rect x="1220" y="60" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1295" y="80" text-anchor="middle" fill="#24292f" font-weight="bold">idleOrCool</text>
  <text x="1295" y="98" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <rect x="1450" y="140" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1525" y="160" text-anchor="middle" fill="#24292f" font-weight="bold">anyViol</text>
  <text x="1525" y="178" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <rect x="1660" y="140" width="160" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1740" y="160" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1740" y="178" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1860" y="150" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1900" y="169" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- fan-out trunks -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 132 75 H 165"/>
    <path d="M 132 155 H 185"/>
    <path d="M 350 85 H 385"/>
    <path d="M 132 395 H 165"/>
    <path d="M 132 485 H 165"/>
  </g>
  <circle cx="165" cy="75" r="3" fill="#7d8590"/>
  <circle cx="185" cy="155" r="3" fill="#7d8590"/>
  <circle cx="385" cy="85" r="3" fill="#7d8590"/>
  <circle cx="165" cy="395" r="3" fill="#7d8590"/>
  <circle cx="165" cy="485" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 165 75 V 73 H 198"/>
    <path d="M 165 75 V 287 H 198"/>
    <path d="M 185 155 V 97 H 198"/>
    <path d="M 185 155 V 263 H 198"/>

    <path d="M 385 85 V 45 H 418"/>
    <path d="M 385 85 V 175 H 618"/>
    <path d="M 350 275 H 618"/>
    <path d="M 550 45 H 618"/>

    <path d="M 165 395 H 198"/>
    <path d="M 165 485 H 198"/>
    <path d="M 350 395 H 385 V 428 H 418"/>
    <path d="M 350 485 H 385 V 452 H 418"/>

    <path d="M 570 440 H 880 V 33 H 968"/>
    <path d="M 165 395 V 345 H 870 V 163 H 968"/>
    <path d="M 165 485 V 545 H 890 V 263 H 968"/>

    <path d="M 860 45 H 940 V 57 H 968"/>
    <path d="M 860 175 H 940 V 187 H 968"/>
    <path d="M 860 275 H 940 V 287 H 968"/>

    <path d="M 1120 45 H 1180 V 73 H 1218"/>
    <path d="M 1120 175 H 1180 V 97 H 1218"/>
    <path d="M 1370 85 H 1410 V 153 H 1448"/>
    <path d="M 1120 275 H 1400 V 177 H 1448"/>

    <path d="M 1600 165 H 1658"/>
    <path d="M 1820 165 H 1858"/>
  </g>

  <!-- annotations -->
  <text x="206" y="133" fill="#7d8590" font-size="11">sat − mat</text>
  <text x="206" y="243" fill="#7d8590" font-size="11">mat − sat</text>
  <text x="420" y="500" fill="#7d8590" font-size="11">idle = no compressor and no heat</text>
</svg>
