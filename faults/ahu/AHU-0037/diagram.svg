<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1910 600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="40" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="59" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="100" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="119" text-anchor="middle" fill="#1e3a8a">rat</text>
    <rect x="12" y="490" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="509" text-anchor="middle" fill="#1e3a8a">oa_dmpr_cmd</text>
  </g>

  <!-- constants: fixed changeover temperature, minimum damper position -->
  <g>
    <rect x="210" y="250" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="335" y="272" text-anchor="middle" fill="#24292f" font-weight="bold">hlConst</text>
    <text x="335" y="290" text-anchor="middle" fill="#57606a" font-size="11">Reals.Sources.Constant · k = 21 °C</text>

    <rect x="210" y="380" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="335" y="402" text-anchor="middle" fill="#24292f" font-weight="bold">minDmpr</text>
    <text x="335" y="420" text-anchor="middle" fill="#57606a" font-size="11">Reals.Sources.Constant · k = 20 %</text>
  </g>

  <!-- changeover gaps and the excess-damper threshold -->
  <g>
    <rect x="510" y="40" width="140" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="580" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">ddbGap</text>
    <text x="580" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="510" y="250" width="140" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="580" y="272" text-anchor="middle" fill="#24292f" font-weight="bold">hlGap</text>
    <text x="580" y="290" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="510" y="380" width="260" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="640" y="402" text-anchor="middle" fill="#24292f" font-weight="bold">excessThr</text>
    <text x="640" y="420" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 1.5</text>
  </g>

  <!-- comparators and the changeover-type constant -->
  <g>
    <rect x="710" y="40" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">ddbUnfav</text>
    <text x="835" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 1 °C</text>

    <rect x="710" y="141" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="163" text-anchor="middle" fill="#24292f" font-weight="bold">isDDB</text>
    <text x="835" y="181" text-anchor="middle" fill="#57606a" font-size="11">Logical.Sources.Constant · k = true</text>

    <rect x="710" y="250" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="272" text-anchor="middle" fill="#24292f" font-weight="bold">hlUnfav</text>
    <text x="835" y="290" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 1 °C</text>

    <rect x="840" y="430" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="925" y="452" text-anchor="middle" fill="#24292f" font-weight="bold">dmprHigh</text>
    <text x="925" y="470" text-anchor="middle" fill="#57606a" font-size="11">Reals.Greater</text>
  </g>

  <!-- changeover-type selector -->
  <rect x="1020" y="130" width="250" height="76" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1145" y="163" text-anchor="middle" fill="#24292f" font-weight="bold">unfavSel</text>
  <text x="1145" y="181" text-anchor="middle" fill="#57606a" font-size="11">Logical.Switch · y = u2 ? u1 : u3</text>

  <!-- conjunction and persistence -->
  <g>
    <rect x="1330" y="290" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1415" y="312" text-anchor="middle" fill="#24292f" font-weight="bold">econUnjust</text>
    <text x="1415" y="330" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="1560" y="290" width="190" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1655" y="312" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="1655" y="330" text-anchor="middle" fill="#57606a" font-size="11">Logical.TrueDelay · 1800 s</text>
  </g>

  <!-- boundary output -->
  <rect x="1800" y="302" width="76" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1838" y="321" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- oat fan-out trunk -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 162 55 H 190"/>
  </g>
  <circle cx="190" cy="55" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 190 55 V 80 H 506"/>
    <path d="M 190 55 V 290 H 506"/>
    <path d="M 162 115 H 230 V 54 H 506"/>
    <path d="M 460 277 H 480 V 264 H 506"/>

    <path d="M 650 67 H 706"/>
    <path d="M 650 277 H 706"/>

    <path d="M 960 67 H 990 V 148 H 1016"/>
    <path d="M 960 168 H 1016"/>
    <path d="M 960 277 H 990 V 188 H 1016"/>

    <path d="M 460 407 H 506"/>
    <path d="M 770 407 H 790 V 470 H 836"/>
    <path d="M 162 505 H 810 V 444 H 836"/>

    <path d="M 1270 168 H 1300 V 304 H 1326"/>
    <path d="M 1010 457 H 1300 V 330 H 1326"/>

    <path d="M 1500 317 H 1556"/>
    <path d="M 1750 317 H 1796"/>
  </g>

  <!-- port labels -->
  <g fill="#7d8590" font-size="10">
    <text x="502" y="54" text-anchor="end">u1</text>
    <text x="502" y="80" text-anchor="end">u2</text>
    <text x="502" y="264" text-anchor="end">u1</text>
    <text x="502" y="290" text-anchor="end">u2</text>
    <text x="1012" y="148" text-anchor="end">u1</text>
    <text x="1012" y="168" text-anchor="end">u2</text>
    <text x="1012" y="188" text-anchor="end">u3</text>
    <text x="832" y="444" text-anchor="end">u1</text>
    <text x="832" y="470" text-anchor="end">u2</text>
    <text x="1322" y="304" text-anchor="end">u1</text>
    <text x="1322" y="330" text-anchor="end">u2</text>
  </g>

  <!-- signal type hints -->
  <g fill="#7d8590" font-size="10">
    <text x="196" y="46">Real</text>
    <text x="668" y="60">Real</text>
    <text x="968" y="60">Bool</text>
    <text x="1518" y="310">Bool</text>
  </g>

  <text x="210" y="560" fill="#7d8590" font-size="11">No temperature ratio anywhere in the graph, so the rule stays evaluable in the narrow OAT/RAT band where AHU-0021 and AHU-0030 report NO_EVAL.</text>
  <text x="210" y="578" fill="#7d8590" font-size="11">minDmpr × excessThr computes the 30 % excess line on the wire, so retuning the site minimum moves the threshold with it. Both comparisons are strict.</text>
</svg>
