<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary input -->
  <rect x="12" y="196" width="110" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="67" y="215" text-anchor="middle" fill="#1e3a8a">sat</text>

  <!-- short-window (scatter) chain -->
  <g>
    <rect x="170" y="30" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="270" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">muShort</text>
    <text x="270" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 900 s</text>

    <rect x="420" y="30" width="140" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="490" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">errShort</text>
    <text x="490" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="600" y="30" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="660" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">devShort</text>
    <text x="660" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

    <rect x="760" y="30" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="860" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">madShort</text>
    <text x="860" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 900 s</text>

    <rect x="1000" y="30" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1115" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">absHigh</text>
    <text x="1115" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 1.2</text>
  </g>

  <!-- long-window (baseline) chain -->
  <g>
    <rect x="170" y="330" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="270" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">muLong</text>
    <text x="270" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 7200 s</text>

    <rect x="420" y="330" width="140" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="490" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">errLong</text>
    <text x="490" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="600" y="330" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="660" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">devLong</text>
    <text x="660" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

    <rect x="760" y="330" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="860" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">madLong</text>
    <text x="860" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 7200 s</text>

    <rect x="1000" y="330" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1115" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">scaledLong</text>
    <text x="1115" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 2</text>
  </g>

  <!-- ratio test and alarm chain -->
  <g>
    <rect x="1270" y="195" width="150" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1345" y="217" text-anchor="middle" fill="#24292f" font-weight="bold">relHigh</text>
    <text x="1345" y="235" text-anchor="middle" fill="#57606a" font-size="11">Reals.Greater</text>

    <rect x="1460" y="111" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1525" y="133" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
    <text x="1525" y="151" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="1630" y="111" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1715" y="133" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="1715" y="151" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>
  </g>

  <!-- boundary output -->
  <rect x="1830" y="125" width="100" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1880" y="144" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- sat fan-out trunk -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 122 211 H 155"/>
  </g>
  <circle cx="155" cy="211" r="3" fill="#7d8590"/>
  <circle cx="975" cy="59" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 155 211 V 59 H 166"/>
    <path d="M 155 211 V 359 H 166"/>
    <path d="M 155 211 V 14 H 392 V 45 H 416"/>
    <path d="M 155 211 V 416 H 392 V 373 H 416"/>

    <path d="M 370 59 H 400 V 73 H 416"/>
    <path d="M 370 359 H 400 V 345 H 416"/>

    <path d="M 560 59 H 596"/>
    <path d="M 560 359 H 596"/>
    <path d="M 720 59 H 756"/>
    <path d="M 720 359 H 756"/>

    <path d="M 960 59 H 996"/>
    <path d="M 960 359 H 996"/>

    <path d="M 975 59 V 210 H 1266"/>
    <path d="M 1230 359 H 1250 V 238 H 1266"/>

    <path d="M 1230 59 H 1400 V 126 H 1456"/>
    <path d="M 1420 224 H 1438 V 154 H 1456"/>

    <path d="M 1590 140 H 1626"/>
    <path d="M 1800 140 H 1826"/>
  </g>

  <!-- port hints where operand order matters -->
  <g fill="#7d8590" font-size="9">
    <text x="424" y="43">u1</text>
    <text x="424" y="78">u2</text>
    <text x="424" y="343">u2</text>
    <text x="424" y="378">u1</text>
    <text x="1274" y="208">u1</text>
    <text x="1274" y="243">u2</text>
  </g>

  <!-- signal type hints -->
  <text x="130" y="190" fill="#7d8590" font-size="10">Real</text>
  <text x="1236" y="46" fill="#7d8590" font-size="10">Bool</text>
</svg>
