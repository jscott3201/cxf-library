<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="45" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="64" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="155" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="174" text-anchor="middle" fill="#1e3a8a">oa_dmpr_cmd</text>
    <rect x="12" y="470" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="489" text-anchor="middle" fill="#1e3a8a">comp_status</text>
  </g>

  <!-- comparators -->
  <g>
    <rect x="256" y="33" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="381" y="55" text-anchor="middle" fill="#24292f" font-weight="bold">oatLow</text>
    <text x="381" y="73" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 21 °C</text>

    <rect x="256" y="143" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="381" y="165" text-anchor="middle" fill="#24292f" font-weight="bold">dmprLow</text>
    <text x="381" y="183" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 25 %</text>

    <rect x="256" y="283" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="381" y="305" text-anchor="middle" fill="#24292f" font-weight="bold">oatHigh</text>
    <text x="381" y="323" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 22 °C</text>

    <rect x="256" y="393" width="250" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="381" y="415" text-anchor="middle" fill="#24292f" font-weight="bold">dmprHigh</text>
    <text x="381" y="433" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 25 %</text>
  </g>

  <!-- branch 1: economizer should be open but is at minimum -->
  <g>
    <rect x="580" y="46" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="645" y="68" text-anchor="middle" fill="#24292f" font-weight="bold">favClg</text>
    <text x="645" y="86" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="790" y="59" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="855" y="81" text-anchor="middle" fill="#24292f" font-weight="bold">stuckMin</text>
    <text x="855" y="99" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  </g>

  <!-- branch 2: economizer should be locked out but is open -->
  <g>
    <rect x="580" y="296" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="645" y="318" text-anchor="middle" fill="#24292f" font-weight="bold">lockClg</text>
    <text x="645" y="336" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="790" y="309" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="855" y="331" text-anchor="middle" fill="#24292f" font-weight="bold">stuckOpen</text>
    <text x="855" y="349" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  </g>

  <!-- combine and persist -->
  <g>
    <rect x="1000" y="180" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1065" y="202" text-anchor="middle" fill="#24292f" font-weight="bold">either</text>
    <text x="1065" y="220" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

    <rect x="1190" y="180" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1275" y="202" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="1275" y="220" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>
  </g>

  <!-- boundary output -->
  <rect x="1420" y="192" width="70" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1455" y="211" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- fan-out trunks -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 162 60 H 200"/>
    <path d="M 162 170 H 220"/>
    <path d="M 162 485 H 540"/>
  </g>
  <circle cx="200" cy="60" r="3" fill="#7d8590"/>
  <circle cx="220" cy="170" r="3" fill="#7d8590"/>
  <circle cx="540" cy="485" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 200 60 H 252"/>
    <path d="M 200 60 V 310 H 252"/>
    <path d="M 220 170 H 252"/>
    <path d="M 220 170 V 420 H 252"/>

    <path d="M 506 60 H 576"/>
    <path d="M 506 310 H 576"/>
    <path d="M 540 485 V 86 H 576"/>
    <path d="M 540 485 V 336 H 576"/>

    <path d="M 710 73 H 786"/>
    <path d="M 506 170 H 760 V 99 H 786"/>
    <path d="M 710 323 H 786"/>
    <path d="M 506 420 H 760 V 349 H 786"/>

    <path d="M 920 86 H 960 V 194 H 996"/>
    <path d="M 920 336 H 960 V 220 H 996"/>

    <path d="M 1130 207 H 1186"/>
    <path d="M 1360 207 H 1416"/>
  </g>

  <!-- port hints -->
  <g fill="#7d8590" font-size="10">
    <text x="574" y="57" text-anchor="end">u1</text>
    <text x="574" y="90" text-anchor="end">u2</text>
    <text x="574" y="307" text-anchor="end">u1</text>
    <text x="574" y="340" text-anchor="end">u2</text>
    <text x="784" y="70" text-anchor="end">u1</text>
    <text x="784" y="103" text-anchor="end">u2</text>
    <text x="784" y="320" text-anchor="end">u1</text>
    <text x="784" y="353" text-anchor="end">u2</text>
    <text x="994" y="191" text-anchor="end">u1</text>
    <text x="994" y="224" text-anchor="end">u2</text>
  </g>

  <!-- signal type hints -->
  <g fill="#7d8590" font-size="10">
    <text x="168" y="42" >Real</text>
    <text x="512" y="52" >Bool</text>
    <text x="168" y="467">Bool</text>
  </g>

  <!-- branch annotations -->
  <text x="855" y="30" text-anchor="middle" fill="#7d8590" font-size="11">branch 1 · free cooling available, damper parked at minimum</text>
  <text x="855" y="400" text-anchor="middle" fill="#7d8590" font-size="11">branch 2 · economizer should be locked out, damper open</text>
</svg>
