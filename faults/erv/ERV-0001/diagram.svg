<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2110 540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="110" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="107" y="129" text-anchor="middle" fill="#1e3a8a">erv_oa_leaving_temp</text>
  <rect x="12" y="200" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="107" y="219" text-anchor="middle" fill="#1e3a8a">erv_oa_entering_temp</text>
  <rect x="12" y="288" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="107" y="307" text-anchor="middle" fill="#1e3a8a">erv_exhaust_temp</text>
  <rect x="12" y="480" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="107" y="499" text-anchor="middle" fill="#1e3a8a">erv_enabled</text>

  <!-- effectiveness ratio -->
  <rect x="280" y="100" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="350" y="120" text-anchor="middle" fill="#24292f" font-weight="bold">rise</text>
  <text x="350" y="138" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>
  <rect x="280" y="290" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="350" y="310" text-anchor="middle" fill="#24292f" font-weight="bold">avail</text>
  <text x="350" y="328" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>
  <rect x="520" y="100" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="590" y="120" text-anchor="middle" fill="#24292f" font-weight="bold">eff</text>
  <text x="590" y="138" text-anchor="middle" fill="#57606a" font-size="11">Reals.Divide</text>
  <rect x="520" y="20" width="250" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="645" y="40" text-anchor="middle" fill="#24292f" font-weight="bold">base</text>
  <text x="645" y="58" text-anchor="middle" fill="#57606a" font-size="11">Reals.Sources.Constant · k = 0.75</text>
  <rect x="830" y="100" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="900" y="120" text-anchor="middle" fill="#24292f" font-weight="bold">shortfall</text>
  <text x="900" y="138" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>
  <rect x="1060" y="100" width="250" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1185" y="120" text-anchor="middle" fill="#24292f" font-weight="bold">shortHigh</text>
  <text x="1185" y="138" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 0.15</text>

  <!-- evaluability branch, which is also the divide guard -->
  <rect x="560" y="290" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="630" y="310" text-anchor="middle" fill="#24292f" font-weight="bold">absDelta</text>
  <text x="630" y="328" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>
  <rect x="790" y="290" width="250" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="915" y="310" text-anchor="middle" fill="#24292f" font-weight="bold">deltaOk</text>
  <text x="915" y="328" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5 °C</text>

  <!-- gate, enable, persistence -->
  <rect x="1360" y="190" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1430" y="210" text-anchor="middle" fill="#24292f" font-weight="bold">gate</text>
  <text x="1430" y="228" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  <rect x="1570" y="190" width="140" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1640" y="210" text-anchor="middle" fill="#24292f" font-weight="bold">armed</text>
  <text x="1640" y="228" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  <rect x="1780" y="190" width="150" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1855" y="210" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1855" y="228" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary outputs -->
  <rect x="2010" y="200" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="2050" y="219" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="1090" y="420" width="140" height="30" rx="15" fill="#fef3c7" stroke="#d97706"/>
  <text x="1160" y="439" text-anchor="middle" fill="#78350f">yTempDeltaOk</text>

  <!-- fan-out trunks -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 202 215 H 240"/>
    <path d="M 450 315 H 490"/>
    <path d="M 1030 315 H 1070"/>
  </g>
  <circle cx="240" cy="215" r="3" fill="#7d8590"/>
  <circle cx="490" cy="315" r="3" fill="#7d8590"/>
  <circle cx="1070" cy="315" r="3" fill="#7d8590"/>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 202 125 H 250 V 113 H 278"/>
    <path d="M 240 215 V 137 H 278"/>
    <path d="M 240 215 V 327 H 278"/>
    <path d="M 202 303 H 278"/>
    <path d="M 420 125 H 495 V 113 H 518"/>
    <path d="M 490 315 V 137 H 518"/>
    <path d="M 490 315 H 558"/>
    <path d="M 770 45 H 800 V 113 H 828"/>
    <path d="M 660 125 H 790 V 137 H 828"/>
    <path d="M 970 125 H 1058"/>
    <path d="M 700 315 H 788"/>
    <path d="M 1310 125 H 1330 V 203 H 1358"/>
    <path d="M 1070 315 V 227 H 1358"/>
    <path d="M 1070 315 V 435 H 1088"/>
    <path d="M 1500 215 H 1545 V 203 H 1568"/>
    <path d="M 202 495 H 1540 V 227 H 1568"/>
    <path d="M 1710 215 H 1778"/>
    <path d="M 1930 215 H 2008"/>
  </g>

  <!-- annotations -->
  <text x="292" y="92" fill="#7d8590" font-size="11">recovered rise</text>
  <text x="292" y="282" fill="#7d8590" font-size="11">available Δ</text>
  <text x="1240" y="439" fill="#7d8590" font-size="11">false ⇒ NO_EVAL</text>
  <text x="1572" y="182" fill="#7d8590" font-size="11">enable gate</text>
</svg>
