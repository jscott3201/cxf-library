  <text x="330" y="172" text-anchor="middle" fill="#24292f" font-weight="bold">cleanApproach</text>
  <text x="330" y="190" text-anchor="middle" fill="#57606a" font-size="11">Reals.Sources.Constant · k = 5 °C</text>
  <rect x="520" y="150" width="260" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="650" y="172" text-anchor="middle" fill="#24292f" font-weight="bold">approachLimit</text>
  <text x="650" y="190" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 2</text>
  <rect x="840" y="40" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="905" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">approachHigh</text>
  <text x="905" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Greater</text>
  <rect x="200" y="290" width="247" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="323.5" y="312" text-anchor="middle" fill="#24292f" font-weight="bold">loadOk</text>
  <text x="323.5" y="330" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 40 %</text>
