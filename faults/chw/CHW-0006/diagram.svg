  <text x="91" y="48" fill="#7d8590" font-size="10">Real</text>
  <text x="138" y="108" fill="#7d8590" font-size="10">Real</text>
  <text x="146" y="308" fill="#7d8590" font-size="10">Real</text>
  <text x="327" y="62" fill="#7d8590" font-size="10">Real</text>
  <text x="466" y="172" fill="#7d8590" font-size="10">Real</text>
  <text x="976" y="62" fill="#7d8590" font-size="10">Bool</text>
  <text x="453" y="312" fill="#7d8590" font-size="10">Bool</text>
  <text x="1330" y="372" fill="#7d8590" font-size="11">false ⇒ NO_EVAL</text>
  <text x="12" y="372" fill="#7d8590" font-size="11">approach = chwst − evap_sat_temp: u1 is the water the machine makes, u2 the refrigerant boiling under it, and a clean barrel keeps that gap small.</text>
  <text x="12" y="390" fill="#7d8590" font-size="11">Single-sided on purpose — a smaller approach is better heat transfer, not a fault — so approachHigh has no low-side twin.</text>
</svg>
