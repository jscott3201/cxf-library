<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs: the fan, the schedule, and the one thing that excuses the run -->
  <g>
    <rect x="12" y="38" width="200" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="112" y="57" text-anchor="middle" fill="#1e3a8a">ef_status</text>
    <rect x="12" y="118" width="200" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="112" y="137" text-anchor="middle" fill="#1e3a8a">occ_scheduled</text>
    <rect x="12" y="198" width="200" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="112" y="217" text-anchor="middle" fill="#1e3a8a">demand_override_active</text>
  </g>

  <rect x="270" y="106" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="325" y="128" text-anchor="middle" fill="#24292f" font-weight="bold">notSched</text>
  <text x="325" y="146" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="270" y="186" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="325" y="208" text-anchor="middle" fill="#24292f" font-weight="bold">notOvr</text>
  <text x="325" y="226" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="440" y="66" width="150" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="515" y="88" text-anchor="middle" fill="#24292f" font-weight="bold">fanUnocc</text>
  <text x="515" y="106" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="650" y="120" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="735" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">noJustification</text>
  <text x="735" y="160" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- the reference's only tunable -->
  <rect x="870" y="120" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="955" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="955" y="160" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="1080" y="132" width="70" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1115" y="151" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 212 53 H 416 V 79 H 436"/>
    <path d="M 212 133 H 266"/>
    <path d="M 212 213 H 266"/>
    <path d="M 380 133 H 416 V 107 H 436"/>
    <path d="M 590 93 H 616 V 133 H 646"/>
    <path d="M 380 213 H 616 V 161 H 646"/>
    <path d="M 820 147 H 866"/>
    <path d="M 1040 147 H 1076"/>
  </g>

  <!-- port hints where two wires meet one block -->
  <text x="420" y="75" fill="#7d8590" font-size="9">u1</text>
  <text x="420" y="121" fill="#7d8590" font-size="9">u2</text>
  <text x="622" y="129" fill="#7d8590" font-size="9">u1</text>
  <text x="622" y="175" fill="#7d8590" font-size="9">u2</text>

  <text x="270" y="272" fill="#7d8590" font-size="11">no override means no justification: every legitimate hold has to reach that one boolean</text>
  <text x="270" y="290" fill="#7d8590" font-size="11">an override that expires restarts the 900 s from the expiry, not from the start of the run</text>
</svg>
