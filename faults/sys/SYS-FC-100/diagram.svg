  <text x="620" y="118" text-anchor="middle" fill="#57606a" font-size="11">Abs</text>

  <rect x="710" y="80" width="200" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="810" y="100" text-anchor="middle" fill="#24292f" font-weight="bold">stillBand</text>
  <text x="810" y="118" text-anchor="middle" fill="#57606a" font-size="11">LessThreshold · 0.25</text>

  <rect x="950" y="80" width="180" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1040" y="100" text-anchor="middle" fill="#24292f" font-weight="bold">stillAndActive</text>
  <text x="1040" y="118" text-anchor="middle" fill="#57606a" font-size="11">And</text>

  <rect x="1170" y="80" width="180" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1260" y="100" text-anchor="middle" fill="#24292f" font-weight="bold">stillHeld</text>
  <text x="1260" y="118" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 2 h</text>

  <rect x="1390" y="80" width="180" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1480" y="100" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1480" y="118" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 15 min</text>

  <!-- evaluability branch -->
  <rect x="950" y="290" width="180" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1040" y="310" text-anchor="middle" fill="#24292f" font-weight="bold">windowOk</text>
  <text x="1040" y="328" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 2 h</text>

  <!-- boundary outputs -->
