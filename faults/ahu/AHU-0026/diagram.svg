<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="38" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="57" text-anchor="middle" fill="#1e3a8a">sf_status</text>
    <rect x="12" y="108" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="127" text-anchor="middle" fill="#1e3a8a">occ_schedule</text>
    <rect x="12" y="178" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="197" text-anchor="middle" fill="#1e3a8a">oa_dmpr_cmd</text>
  </g>

  <!-- occupancy row: Not -> And with fan status -->
  <rect x="200" y="96" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="255" y="118" text-anchor="middle" fill="#24292f" font-weight="bold">notOcc</text>
  <text x="255" y="136" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="360" y="60" width="150" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="435" y="82" text-anchor="middle" fill="#24292f" font-weight="bold">unoccRun</text>
  <text x="435" y="100" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- damper row: threshold -->
  <rect x="190" y="166" width="240" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="310" y="188" text-anchor="middle" fill="#24292f" font-weight="bold">dmprOpen</text>
  <text x="310" y="206" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5.0 %</text>

  <!-- combine -->
  <rect x="560" y="120" width="150" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="635" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">unjustified</text>
  <text x="635" y="160" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="760" y="120" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="840" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="840" y="160" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="950" y="132" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="984" y="151" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 152 53 H 340 V 74 H 358"/>
    <path d="M 152 123 H 198"/>
    <path d="M 310 123 H 340 V 100 H 358"/>
    <path d="M 152 193 H 188"/>
    <path d="M 510 87 H 535 V 134 H 558"/>
    <path d="M 430 193 H 535 V 160 H 558"/>
    <path d="M 710 147 H 758"/>
    <path d="M 920 147 H 948"/>
  </g>

  <!-- signal type hints -->
  <text x="155" y="185" fill="#7d8590" font-size="10">Real</text>
  <text x="440" y="185" fill="#7d8590" font-size="10">Bool</text>
</svg>
