<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="20" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="39" text-anchor="middle" fill="#1e3a8a">mat</text>
    <rect x="12" y="90" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="109" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="140" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="159" text-anchor="middle" fill="#1e3a8a">rat</text>
  </g>

  <!-- high bound, gap, threshold, persistence -->
  <rect x="200" y="102" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="260" y="124" text-anchor="middle" fill="#24292f" font-weight="bold">envHi</text>
  <text x="260" y="142" text-anchor="middle" fill="#57606a" font-size="11">Reals.Max</text>

  <rect x="370" y="42" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="435" y="64" text-anchor="middle" fill="#24292f" font-weight="bold">gap</text>
  <text x="435" y="82" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="550" y="42" width="240" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="670" y="64" text-anchor="middle" fill="#24292f" font-weight="bold">gapBig</text>
  <text x="670" y="82" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 2 °C</text>

  <rect x="840" y="42" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="920" y="64" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="920" y="82" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1040" y="54" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1080" y="73" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 132 35 H 344 V 56 H 368"/>
    <path d="M 132 105 H 170 V 116 H 198"/>
    <path d="M 132 155 H 170 V 142 H 198"/>
    <path d="M 320 129 H 344 V 82 H 368"/>
    <path d="M 500 69 H 548"/>
    <path d="M 790 69 H 838"/>
    <path d="M 1000 69 H 1038"/>
  </g>
</svg>
