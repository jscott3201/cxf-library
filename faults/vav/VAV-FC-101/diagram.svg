  <text x="215" y="762" fill="#7d8590" font-size="11">z = (CFMerror − x̄)/σ̂ once; the S chart accumulates max(0, z − k) and the mirrored T chart max(0, −z − k), each through its own UnitDelay.</text>
  <text x="215" y="782" fill="#7d8590" font-size="11">sReset/tReset zero both the published sum and the delay input while occGate is false, so unoccupied hours (and the first occupied hour) hold no state.</text>
