<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="52" width="128" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="76" y="71" text-anchor="middle" fill="#1e3a8a">htg_vlv_cmd</text>
    <rect x="12" y="152" width="128" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="76" y="171" text-anchor="middle" fill="#1e3a8a">clg_vlv_cmd</text>
  </g>

  <!-- threshold blocks -->
  <g>
    <rect x="192" y="38" width="248" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="316" y="60" text-anchor="middle" fill="#24292f" font-weight="bold">htgThr</text>
    <text x="316" y="78" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5.0 %</text>

    <rect x="192" y="138" width="248" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="316" y="160" text-anchor="middle" fill="#24292f" font-weight="bold">clgThr</text>
    <text x="316" y="178" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5.0 %</text>
  </g>

  <!-- and block -->
  <rect x="496" y="88" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="556" y="110" text-anchor="middle" fill="#24292f" font-weight="bold">bothOpen</text>
  <text x="556" y="128" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- true delay block -->
  <rect x="656" y="88" width="164" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="738" y="110" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="738" y="128" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="850" y="102" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="884" y="121" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 140 67 H 190"/>
    <path d="M 140 167 H 190"/>
    <path d="M 440 67 H 472 V 103 H 494"/>
    <path d="M 440 167 H 472 V 131 H 494"/>
    <path d="M 616 117 H 654"/>
    <path d="M 820 117 H 848"/>
  </g>

  <!-- signal type hints -->
  <text x="160" y="60" fill="#7d8590" font-size="10">Real</text>
  <text x="453" y="60" fill="#7d8590" font-size="10">Bool</text>
  <text x="626" y="110" fill="#7d8590" font-size="10">Bool</text>
</svg>
