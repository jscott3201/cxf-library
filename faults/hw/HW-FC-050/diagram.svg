<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary input -->
  <rect x="12" y="54" width="124" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="74" y="73" text-anchor="middle" fill="#1e3a8a">boiler_status</text>

  <!-- row 1: start detection and rolling mean -->
  <g>
    <rect x="200" y="40" width="90" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="245" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">start</text>
    <text x="245" y="80" text-anchor="middle" fill="#57606a" font-size="11">Logical.Edge</text>

    <rect x="320" y="40" width="196" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="418" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">pulseInt</text>
    <text x="418" y="80" text-anchor="middle" fill="#57606a" font-size="11">Conversions.BooleanToInteger</text>

    <rect x="546" y="40" width="176" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="634" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">pulseReal</text>
    <text x="634" y="80" text-anchor="middle" fill="#57606a" font-size="11">Conversions.IntegerToReal</text>

    <rect x="752" y="40" width="249" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="876" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">rate</text>
    <text x="876" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · delta = 3600 s</text>
  </g>

  <!-- row 2: rescale, threshold, persistence -->
  <g>
    <rect x="200" y="220" width="236" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="318" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">count</text>
    <text x="318" y="260" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 12</text>

    <rect x="466" y="220" width="209" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="570" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">cntHigh</text>
    <text x="570" y="260" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 4</text>

    <rect x="705" y="220" width="123" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="766" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="766" y="260" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>
  </g>

  <!-- boundary output -->
  <rect x="858" y="234" width="69" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="892" y="253" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 136 69 H 196"/>
    <path d="M 290 69 H 316"/>
    <path d="M 516 69 H 542"/>
    <path d="M 722 69 H 748"/>

    <path d="M 1001 69 H 1029 V 159 H 170 V 249 H 196"/>

    <path d="M 436 249 H 462"/>
    <path d="M 675 249 H 701"/>
    <path d="M 828 249 H 854"/>
  </g>

  <!-- signal type hints -->
  <text x="142" y="60" fill="#7d8590" font-size="10">Bool</text>
  <text x="294" y="60" fill="#7d8590" font-size="10">Bool</text>
  <text x="520" y="60" fill="#7d8590" font-size="10">Int</text>
  <text x="726" y="60" fill="#7d8590" font-size="10">Real</text>
  <text x="176" y="240" fill="#7d8590" font-size="10">Real</text>
  <text x="679" y="240" fill="#7d8590" font-size="10">Bool</text>

  <!-- wrap annotation -->
  <text x="600" y="152" text-anchor="middle" fill="#7d8590" font-size="11">rolling mean of the start pulses (starts per second) continues below</text>
</svg>
