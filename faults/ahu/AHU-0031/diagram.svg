<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="44" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="63" text-anchor="middle" fill="#1e3a8a">dsp</text>
    <rect x="12" y="124" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="143" text-anchor="middle" fill="#1e3a8a">dsp_sp</text>
    <rect x="12" y="234" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="253" text-anchor="middle" fill="#1e3a8a">zone_dmpr_pos_max</text>
    <rect x="12" y="344" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="363" text-anchor="middle" fill="#1e3a8a">sf_status</text>
  </g>

  <!-- setpoint scaling -->
  <rect x="250" y="110" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="375" y="132" text-anchor="middle" fill="#24292f" font-weight="bold">scaled</text>
  <text x="375" y="150" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 0.95</text>

  <!-- comparisons -->
  <rect x="560" y="45" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="645" y="67" text-anchor="middle" fill="#24292f" font-weight="bold">spHigh</text>
  <text x="645" y="85" text-anchor="middle" fill="#57606a" font-size="11">Reals.Greater</text>

  <rect x="560" y="220" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="685" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">dmprLow</text>
  <text x="685" y="260" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 50 %</text>

  <!-- conjunctions -->
  <rect x="870" y="140" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="935" y="162" text-anchor="middle" fill="#24292f" font-weight="bold">demand</text>
  <text x="935" y="180" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="1060" y="185" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1125" y="207" text-anchor="middle" fill="#24292f" font-weight="bold">gated</text>
  <text x="1125" y="225" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="1250" y="185" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1340" y="207" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1340" y="225" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1490" y="199" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1530" y="218" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 202 59 H 556"/>
    <path d="M 202 139 H 246"/>
    <path d="M 500 139 H 525 V 89 H 556"/>
    <path d="M 202 249 H 556"/>

    <path d="M 730 74 H 840 V 154 H 866"/>
    <path d="M 810 249 H 840 V 184 H 866"/>

    <path d="M 1000 169 H 1030 V 199 H 1056"/>
    <path d="M 202 359 H 1030 V 229 H 1056"/>

    <path d="M 1190 214 H 1246"/>
    <path d="M 1430 214 H 1486"/>
  </g>

  <!-- signal type hints -->
  <text x="210" y="38" fill="#7d8590" font-size="10">Real</text>
  <text x="210" y="338" fill="#7d8590" font-size="10">Bool</text>
  <text x="740" y="68" fill="#7d8590" font-size="10">Bool</text>
</svg>
