  <rect x="12" y="300" width="130" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="77" y="319" text-anchor="middle" fill="#1e3a8a">equip_active</text>

  <!-- stillness chain -->
  <rect x="180" y="40" width="160" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="260" y="60" text-anchor="middle" fill="#24292f" font-weight="bold">sensRef</text>
  <text x="260" y="78" text-anchor="middle" fill="#57606a" font-size="11">Sampler · 2 h</text>

  <rect x="400" y="80" width="130" height="50" rx="6" fill="#f6f8fa" stroke="#57606a"/>
