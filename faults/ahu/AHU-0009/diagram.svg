<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 815 120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="18" width="86" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="37" text-anchor="middle" fill="#1e3a8a">oat</text>

  <rect x="12" y="72" width="86" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="91" text-anchor="middle" fill="#1e3a8a">sat_sp</text>

  <!-- gap -->
  <rect x="180" y="33" width="180" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="270" y="55" text-anchor="middle" fill="#24292f" font-weight="bold">gap</text>
  <text x="270" y="73" text-anchor="middle" fill="#57606a" font-size="11">Subtract · oat − sat_sp</text>

  <!-- threshold -->
  <rect x="400" y="33" width="220" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="510" y="55" text-anchor="middle" fill="#24292f" font-weight="bold">gapBig</text>
  <text x="510" y="73" text-anchor="middle" fill="#57606a" font-size="11">GreaterThreshold · t = 1.0 °C</text>

  <!-- persistence -->
  <rect x="638" y="33" width="86" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="681" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="681" y="68" text-anchor="middle" fill="#57606a" font-size="10">TrueDelay</text>
  <text x="681" y="81" text-anchor="middle" fill="#57606a" font-size="10">1800 s</text>

  <!-- boundary output -->
  <rect x="750" y="45" width="56" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="778" y="64" text-anchor="middle" fill="#7f1d1d" font-size="11">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 98 33 H 140 V 48 H 178"/>
    <path d="M 98 87 H 140 V 72 H 178"/>
    <path d="M 360 60 H 398"/>
    <path d="M 620 60 H 636"/>
    <path d="M 724 60 H 748"/>
  </g>

  <text x="160" y="44" text-anchor="middle" fill="#57606a" font-size="10">u1</text>
  <text x="160" y="87" text-anchor="middle" fill="#57606a" font-size="10">u2</text>
</svg>
