<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="39" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="58" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="134" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="153" text-anchor="middle" fill="#1e3a8a">mat</text>
    <rect x="12" y="229" width="140" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="82" y="248" text-anchor="middle" fill="#1e3a8a">rat</text>
  </g>

  <!-- low branch: min(oat,rat) - mat > tol -->
  <rect x="250" y="36" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="310" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">lowBound</text>
  <text x="310" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.Min</text>

  <rect x="420" y="36" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="485" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">lowGap</text>
  <text x="485" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="600" y="36" width="180" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="690" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">belowMin</text>
  <text x="690" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 2 °C</text>

  <!-- high branch: mat - max(oat,rat) > tol -->
  <rect x="250" y="206" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="310" y="228" text-anchor="middle" fill="#24292f" font-weight="bold">highBound</text>
  <text x="310" y="246" text-anchor="middle" fill="#57606a" font-size="11">Reals.Max</text>

  <rect x="420" y="206" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="485" y="228" text-anchor="middle" fill="#24292f" font-weight="bold">highGap</text>
  <text x="485" y="246" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="600" y="206" width="180" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="690" y="228" text-anchor="middle" fill="#24292f" font-weight="bold">aboveMax</text>
  <text x="690" y="246" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 2 °C</text>

  <!-- combine and persist -->
  <rect x="830" y="121" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="885" y="143" text-anchor="middle" fill="#24292f" font-weight="bold">outOfRange</text>
  <text x="885" y="161" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <rect x="990" y="121" width="150" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1065" y="143" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1065" y="161" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="1180" y="133" width="70" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1215" y="152" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 152 54 H 248"/>
    <path d="M 200 54 V 224 H 248"/>
    <path d="M 152 244 H 248"/>
    <path d="M 220 244 V 74 H 248"/>
    <path d="M 152 149 H 400 V 74 H 418"/>
    <path d="M 400 149 V 224 H 418"/>
    <path d="M 370 63 H 385 V 54 H 418"/>
    <path d="M 370 233 H 385 V 244 H 418"/>
    <path d="M 550 63 H 598"/>
    <path d="M 550 233 H 598"/>
    <path d="M 780 63 H 805 V 139 H 828"/>
    <path d="M 780 233 H 805 V 159 H 828"/>
    <path d="M 940 148 H 988"/>
    <path d="M 1140 148 H 1178"/>
  </g>
</svg>
