<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs (template points: bound per monitored actuator) -->
  <g>
    <rect x="12" y="40" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="59" text-anchor="middle" fill="#1e3a8a">actuator_cmd</text>
    <rect x="12" y="118" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="137" text-anchor="middle" fill="#1e3a8a">actuator_pos</text>
  </g>

  <!-- tracking error -->
  <rect x="210" y="52" width="140" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="280" y="74" text-anchor="middle" fill="#24292f" font-weight="bold">err</text>
  <text x="280" y="92" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="390" y="52" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="450" y="74" text-anchor="middle" fill="#24292f" font-weight="bold">absErr</text>
  <text x="450" y="92" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

  <rect x="550" y="52" width="260" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="680" y="74" text-anchor="middle" fill="#24292f" font-weight="bold">errBig</text>
  <text x="680" y="92" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 10 %</text>

  <!-- two-stage timing -->
  <rect x="850" y="52" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="935" y="74" text-anchor="middle" fill="#24292f" font-weight="bold">stuck</text>
  <text x="935" y="92" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <rect x="1060" y="52" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1140" y="74" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1140" y="92" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 300 s</text>

  <!-- boundary output -->
  <rect x="1260" y="64" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1294" y="83" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 162 55 H 190 V 65 H 206"/>
    <path d="M 162 133 H 190 V 93 H 206"/>
    <path d="M 350 79 H 386"/>
    <path d="M 510 79 H 546"/>
    <path d="M 810 79 H 846"/>
    <path d="M 1020 79 H 1056"/>
    <path d="M 1220 79 H 1256"/>
  </g>

  <!-- signal type hints -->
  <text x="170" y="34" fill="#7d8590" font-size="10">Real</text>
  <text x="818" y="46" fill="#7d8590" font-size="10">Bool</text>
</svg>
