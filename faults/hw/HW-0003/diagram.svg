<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="38" width="124" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="74" y="57" text-anchor="middle" fill="#1e3a8a">boiler_status</text>
  <rect x="12" y="98" width="132" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="78" y="117" text-anchor="middle" fill="#1e3a8a">hw_pump_status</text>
  <rect x="12" y="200" width="46" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="35" y="219" text-anchor="middle" fill="#1e3a8a">oat</text>

  <!-- plant running: either machine counts -->
  <rect x="210" y="54" width="77" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="248.5" y="76" text-anchor="middle" fill="#24292f" font-weight="bold">plantOn</text>
  <text x="248.5" y="94" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <!-- above the lockout temperature -->
  <rect x="210" y="186" width="249" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="334.5" y="208" text-anchor="middle" fill="#24292f" font-weight="bold">mildOat</text>
  <text x="334.5" y="226" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 16.0 °C</text>

  <rect x="520" y="120" width="104" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="572" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">aboveLockout</text>
  <text x="572" y="160" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="670" y="120" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="735" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">sustained</text>
  <text x="735" y="160" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <!-- boundary output -->
  <rect x="840" y="134" width="69" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="874.5" y="153" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 136 53 H 170 V 69 H 206"/>
    <path d="M 144 113 H 180 V 97 H 206"/>
    <path d="M 58 215 H 206"/>
    <path d="M 287 83 H 490 V 135 H 516"/>
    <path d="M 459 215 H 490 V 163 H 516"/>
    <path d="M 624 149 H 666"/>
    <path d="M 800 149 H 836"/>
  </g>

  <!-- signal type hints -->
  <text x="142" y="44" fill="#7d8590" font-size="10">Bool</text>
  <text x="150" y="104" fill="#7d8590" font-size="10">Bool</text>
  <text x="64" y="206" fill="#7d8590" font-size="10">Real</text>
  <text x="293" y="76" fill="#7d8590" font-size="10">Bool</text>
  <text x="465" y="208" fill="#7d8590" font-size="10">Bool</text>
  <text x="216" y="65" fill="#7d8590" font-size="9">u1</text>
  <text x="216" y="109" fill="#7d8590" font-size="9">u2</text>
  <text x="526" y="131" fill="#7d8590" font-size="9">u1</text>
  <text x="526" y="175" fill="#7d8590" font-size="9">u2</text>
</svg>
