<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 10; }
    .file { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .side { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .out  { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
    .lbl  { fill: #0f172a; }
    .sub  { fill: #64748b; font-size: 11px; }
    .wire { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- fault rule bundle -->
  <rect x="20" y="28" width="240" height="170" class="box" rx="12"/>
  <text x="40" y="52" class="lbl" font-weight="bold">faults/&lt;equip&gt;/&lt;ID&gt;/</text>
  <rect x="40" y="66" width="200" height="30" class="file" rx="8"/>
  <text x="52" y="86" class="lbl">card.md</text>
  <text x="130" y="86" class="sub">contract + prose</text>
  <rect x="40" y="102" width="200" height="30" class="file" rx="8"/>
  <text x="52" y="122" class="lbl">rule.cxf.jsonld</text>
  <text x="172" y="122" class="sub">CDL graph</text>
  <rect x="40" y="138" width="200" height="30" class="file" rx="8"/>
  <text x="52" y="158" class="lbl">vectors.json</text>
  <text x="160" y="158" class="sub">test scenarios</text>
  <text x="40" y="188" class="sub">+ diagram.svg</text>

  <!-- shared indexes -->
  <rect x="20" y="240" width="240" height="150" class="side" rx="12"/>
  <text x="40" y="264" class="lbl" font-weight="bold">shared indexes</text>
  <rect x="40" y="278" width="200" height="28" class="side" rx="8"/>
  <text x="52" y="297" class="lbl">points/*.points.json</text>
  <rect x="40" y="312" width="200" height="28" class="side" rx="8"/>
  <text x="52" y="331" class="lbl">playbooks/*.md</text>
  <rect x="40" y="346" width="200" height="28" class="side" rx="8"/>
  <text x="52" y="365" class="lbl">clusters/clusters.json</text>

  <!-- verify harness -->
  <rect x="360" y="80" width="200" height="90" class="box" rx="12"/>
  <text x="380" y="110" class="lbl" font-weight="bold">tools/verify</text>
  <text x="380" y="130" class="sub">loads CXF, replays vectors,</text>
  <text x="380" y="146" class="sub">lints every cross-contract</text>

  <!-- engine -->
  <rect x="650" y="80" width="190" height="90" class="box" rx="12"/>
  <text x="670" y="110" class="lbl" font-weight="bold">open-control</text>
  <text x="670" y="130" class="sub">deterministic CDL engine,</text>
  <text x="670" y="146" class="sub">pinned revision</text>

  <!-- verified output -->
  <rect x="650" y="210" width="190" height="46" class="out" rx="20"/>
  <text x="672" y="238" class="lbl" font-weight="bold">verified: content_id ✓</text>

  <!-- book pipeline -->
  <rect x="360" y="300" width="200" height="90" class="box" rx="12"/>
  <text x="380" y="330" class="lbl" font-weight="bold">tools/book</text>
  <text x="380" y="350" class="sub">generates mdBook from the</text>
  <text x="380" y="366" class="sub">same files — nothing twice</text>

  <rect x="650" y="322" width="190" height="46" class="box" rx="20"/>
  <text x="682" y="350" class="lbl" font-weight="bold">GitHub Pages</text>

  <!-- wires -->
  <line x1="260" y1="113" x2="356" y2="113" class="wire"/>
  <path d="M 260 290 C 320 290 330 200 356 160" class="wire"/>
  <line x1="560" y1="125" x2="646" y2="125" class="wire"/>
  <path d="M 745 170 L 745 206" class="wire"/>
  <line x1="260" y1="345" x2="356" y2="345" class="wire"/>
  <path d="M 130 198 L 130 236" class="wire"/>
  <line x1="560" y1="345" x2="646" y2="345" class="wire"/>
</svg>
