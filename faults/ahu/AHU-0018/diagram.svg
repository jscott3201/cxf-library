<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="38" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="57" text-anchor="middle" fill="#1e3a8a">sf_status</text>
    <rect x="12" y="108" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="127" text-anchor="middle" fill="#1e3a8a">occ_schedule</text>
    <rect x="12" y="178" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="87" y="197" text-anchor="middle" fill="#1e3a8a">override_active</text>
  </g>

  <!-- occupancy row: Not -> TrueDelay(grace) -->
  <rect x="210" y="96" width="100" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="260" y="118" text-anchor="middle" fill="#24292f" font-weight="bold">notOcc</text>
  <text x="260" y="136" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="350" y="96" width="176" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="438" y="118" text-anchor="middle" fill="#24292f" font-weight="bold">unoccGrace</text>
  <text x="438" y="136" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- override row: Not -->
  <rect x="210" y="166" width="100" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="260" y="188" text-anchor="middle" fill="#24292f" font-weight="bold">notOvr</text>
  <text x="260" y="206" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <!-- and blocks -->
  <rect x="576" y="60" width="140" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="646" y="82" text-anchor="middle" fill="#24292f" font-weight="bold">runAndUnocc</text>
  <text x="646" y="100" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="756" y="120" width="150" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="831" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">noJustification</text>
  <text x="831" y="160" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="946" y="120" width="140" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1016" y="142" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1016" y="160" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>

  <!-- boundary output -->
  <rect x="1078" y="210" width="70" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1113" y="229" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 162 53 H 545 V 74 H 574"/>
    <path d="M 162 123 H 208"/>
    <path d="M 310 123 H 348"/>
    <path d="M 526 123 H 545 V 100 H 574"/>
    <path d="M 162 193 H 726 V 160 H 754"/>
    <path d="M 716 87 H 736 V 134 H 754"/>
    <path d="M 906 147 H 944"/>
    <path d="M 1086 147 H 1113 V 208"/>
  </g>
</svg>
