<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary input -->
  <rect x="12" y="54" width="150" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="87" y="73" text-anchor="middle" fill="#1e3a8a">operating_state</text>

  <!-- row 1: edge detection and rolling mean -->
  <g>
    <rect x="200" y="40" width="240" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="320" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">chg</text>
    <text x="320" y="80" text-anchor="middle" fill="#57606a" font-size="11">Integers.Change · pre_u_start = 0</text>

    <rect x="470" y="40" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="570" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">pulseInt</text>
    <text x="570" y="80" text-anchor="middle" fill="#57606a" font-size="11">Conversions.BooleanToInteger</text>

    <rect x="700" y="40" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="800" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">pulseReal</text>
    <text x="800" y="80" text-anchor="middle" fill="#57606a" font-size="11">Conversions.IntegerToReal</text>

    <rect x="930" y="40" width="260" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1060" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">rate</text>
    <text x="1060" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · delta = 3600 s</text>
  </g>

  <!-- row 2: rescale, threshold, persistence -->
  <g>
    <rect x="200" y="220" width="240" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="320" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">count</text>
    <text x="320" y="260" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 12</text>

    <rect x="470" y="220" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="585" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">cntHigh</text>
    <text x="585" y="260" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 7</text>

    <rect x="730" y="220" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="830" y="242" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="830" y="260" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>
  </g>

  <!-- boundary output -->
  <rect x="960" y="234" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="994" y="253" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 162 69 H 196"/>
    <path d="M 440 69 H 466"/>
    <path d="M 670 69 H 696"/>
    <path d="M 900 69 H 926"/>

    <path d="M 1190 69 H 1218 V 159 H 170 V 249 H 196"/>

    <path d="M 440 249 H 466"/>
    <path d="M 700 249 H 726"/>
    <path d="M 930 249 H 956"/>
  </g>

  <!-- signal type hints -->
  <text x="168" y="60" fill="#7d8590" font-size="10">Int</text>
  <text x="444" y="60" fill="#7d8590" font-size="10">Bool</text>
  <text x="674" y="60" fill="#7d8590" font-size="10">Int</text>
  <text x="904" y="60" fill="#7d8590" font-size="10">Real</text>
  <text x="176" y="240" fill="#7d8590" font-size="10">Real</text>
  <text x="704" y="240" fill="#7d8590" font-size="10">Bool</text>

  <!-- wrap annotation -->
  <text x="695" y="152" text-anchor="middle" fill="#7d8590" font-size="11">rolling mean of the pulse train (changes per second) continues below</text>
</svg>
