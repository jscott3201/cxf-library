  <text x="1060.5" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">gate</text>
  <text x="1060.5" y="80" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  <rect x="1151" y="40" width="147" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1224.5" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1224.5" y="80" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>
  <rect x="1330" y="54" width="81" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
