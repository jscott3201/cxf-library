<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="44" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="63" text-anchor="middle" fill="#1e3a8a">zone_temp_sp_htg</text>
    <rect x="12" y="124" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="143" text-anchor="middle" fill="#1e3a8a">zone_temp</text>
    <rect x="12" y="204" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="223" text-anchor="middle" fill="#1e3a8a">zone_temp_sp_clg</text>
    <rect x="12" y="384" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="403" text-anchor="middle" fill="#1e3a8a">rht_vlv_cmd</text>
  </g>

  <!-- band bounds as positive gaps -->
  <rect x="250" y="40" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="340" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">gapH</text>
  <text x="340" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="250" y="180" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="340" y="202" text-anchor="middle" fill="#24292f" font-weight="bold">gapC</text>
  <text x="340" y="220" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="490" y="40" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="615" y="62" text-anchor="middle" fill="#24292f" font-weight="bold">aboveHtg</text>
  <text x="615" y="80" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 0.5 °C</text>

  <rect x="490" y="180" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="615" y="202" text-anchor="middle" fill="#24292f" font-weight="bold">belowClg</text>
  <text x="615" y="220" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 0.5 °C</text>

  <!-- valve test -->
  <rect x="490" y="370" width="270" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="625" y="392" text-anchor="middle" fill="#24292f" font-weight="bold">rhtOn</text>
  <text x="625" y="410" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 15 %</text>

  <!-- conjunctions -->
  <rect x="800" y="110" width="150" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="875" y="132" text-anchor="middle" fill="#24292f" font-weight="bold">satisfied</text>
  <text x="875" y="150" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="1010" y="210" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1075" y="232" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
  <text x="1075" y="250" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="1190" y="210" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1280" y="232" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1280" y="250" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1420" y="224" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1460" y="243" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 202 59 H 246"/>
    <path d="M 202 139 H 226 V 83 H 246"/>
    <path d="M 202 139 H 226 V 199 H 246"/>
    <path d="M 202 219 H 246"/>

    <path d="M 430 69 H 486"/>
    <path d="M 430 209 H 486"/>

    <path d="M 740 69 H 770 V 125 H 796"/>
    <path d="M 740 209 H 770 V 153 H 796"/>

    <path d="M 202 399 H 486"/>
    <path d="M 760 399 H 980 V 225 H 1006"/>
    <path d="M 950 139 H 980 V 253 H 1006"/>

    <path d="M 1140 239 H 1186"/>
    <path d="M 1370 239 H 1416"/>
  </g>

  <!-- signal type hints -->
  <text x="210" y="38" fill="#7d8590" font-size="10">Real</text>
  <text x="210" y="378" fill="#7d8590" font-size="10">Real</text>
  <text x="440" y="63" fill="#7d8590" font-size="10">Real</text>
  <text x="750" y="63" fill="#7d8590" font-size="10">Bool</text>
  <text x="770" y="393" fill="#7d8590" font-size="10">Bool</text>
</svg>
