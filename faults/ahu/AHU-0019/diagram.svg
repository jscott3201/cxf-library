<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="44" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="63" text-anchor="middle" fill="#1e3a8a">sat_sp</text>
    <rect x="12" y="154" width="190" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="107" y="173" text-anchor="middle" fill="#1e3a8a">zone_reheat_fraction</text>
  </g>

  <!-- threshold blocks -->
  <g>
    <rect x="240" y="30" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="365" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">spLow</text>
    <text x="365" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.LessThreshold · t = 12 °C</text>

    <rect x="240" y="140" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="365" y="162" text-anchor="middle" fill="#24292f" font-weight="bold">rhtHigh</text>
    <text x="365" y="180" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 0.5</text>
  </g>

  <!-- conjunction -->
  <rect x="560" y="85" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="620" y="107" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
  <text x="620" y="125" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <!-- persistence -->
  <rect x="750" y="85" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="840" y="107" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="840" y="125" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 3600 s</text>

  <!-- boundary output -->
  <rect x="990" y="99" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1030" y="118" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 202 59 H 236"/>
    <path d="M 202 169 H 236"/>

    <path d="M 490 59 H 525 V 99 H 556"/>
    <path d="M 490 169 H 525 V 129 H 556"/>

    <path d="M 680 114 H 746"/>
    <path d="M 930 114 H 986"/>
  </g>

  <!-- signal type hints -->
  <text x="210" y="38" fill="#7d8590" font-size="10">Real</text>
  <text x="500" y="52" fill="#7d8590" font-size="10">Bool</text>
</svg>
