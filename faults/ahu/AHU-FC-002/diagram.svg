<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="20" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="39" text-anchor="middle" fill="#1e3a8a">oat</text>
    <rect x="12" y="70" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="89" text-anchor="middle" fill="#1e3a8a">rat</text>
    <rect x="12" y="160" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="179" text-anchor="middle" fill="#1e3a8a">mat</text>
  </g>

  <!-- low bound, gap, threshold, persistence -->
  <rect x="200" y="32" width="120" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="260" y="54" text-anchor="middle" fill="#24292f" font-weight="bold">envLo</text>
  <text x="260" y="72" text-anchor="middle" fill="#57606a" font-size="11">Reals.Min</text>

  <rect x="370" y="100" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="435" y="122" text-anchor="middle" fill="#24292f" font-weight="bold">gap</text>
  <text x="435" y="140" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

  <rect x="550" y="100" width="240" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="670" y="122" text-anchor="middle" fill="#24292f" font-weight="bold">gapBig</text>
  <text x="670" y="140" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 2 °C</text>

  <rect x="840" y="100" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="920" y="122" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="920" y="140" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="1040" y="112" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1080" y="131" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 132 35 H 170 V 46 H 198"/>
    <path d="M 132 85 H 170 V 72 H 198"/>
    <path d="M 320 59 H 344 V 114 H 368"/>
    <path d="M 132 175 H 344 V 140 H 368"/>
    <path d="M 500 127 H 548"/>
    <path d="M 790 127 H 838"/>
    <path d="M 1000 127 H 1038"/>
  </g>
</svg>
