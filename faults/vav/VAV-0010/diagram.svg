      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect x="270" y="110" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="355" y="132" text-anchor="middle" fill="#24292f" font-weight="bold">err</text>
  <text x="355" y="150" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>
  <rect x="490" y="30" width="225" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="602.5" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">highCmp</text>
  <text x="602.5" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 3.0</text>
  <rect x="490" y="190" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="615" y="212" text-anchor="middle" fill="#24292f" font-weight="bold">negErr</text>
  <text x="615" y="230" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = -1</text>
  <rect x="790" y="190" width="225" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="902.5" y="212" text-anchor="middle" fill="#24292f" font-weight="bold">lowCmp</text>
  <text x="902.5" y="230" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 3.0</text>
  <rect x="1065" y="110" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1150" y="132" text-anchor="middle" fill="#24292f" font-weight="bold">anyDir</text>
  <text x="1150" y="150" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>
  <rect x="1285" y="110" width="190" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1380" y="132" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="1380" y="150" text-anchor="middle" fill="#57606a" font-size="11">Logical.TrueDelay · 7200 s</text>
  <rect x="12" y="92" width="175" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="99.5" y="111" text-anchor="middle" fill="#1e3a8a">zone_temp</text>
