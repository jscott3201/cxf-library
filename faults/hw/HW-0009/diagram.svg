  <g fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 157 190 H 230 V 59 H 270"/>
    <path d="M 132 110 H 248 V 239 H 270"/>
    <path d="M 132 110 H 200 V 14 H 500 V 47 H 520"/>
