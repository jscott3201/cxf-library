  <text x="215" y="762" fill="#7d8590" font-size="11">sGate and tGate feed their own unit delays: the delay&#8217;s output is last sample&#8217;s sum, which is what makes the loop legal.</text>
  <text x="215" y="782" fill="#7d8590" font-size="11">The same Switch zeroes the published sum and the delay input together, so an unoccupied tick clears the state rather than hiding it.</text>
