<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs: each point feeds its own direction and negates the other's -->
  <g>
    <rect x="12" y="60" width="110" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="67" y="79" text-anchor="middle" fill="#1e3a8a">sf_cmd</text>
    <rect x="12" y="280" width="110" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="67" y="299" text-anchor="middle" fill="#1e3a8a">sf_status</text>
  </g>

  <rect x="200" y="126" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="265" y="148" text-anchor="middle" fill="#24292f" font-weight="bold">notStatus</text>
  <text x="265" y="166" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <rect x="200" y="226" width="130" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="265" y="248" text-anchor="middle" fill="#24292f" font-weight="bold">notCmd</text>
  <text x="265" y="266" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>

  <!-- start direction: commanded on, not proven -->
  <rect x="420" y="46" width="190" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="515" y="68" text-anchor="middle" fill="#24292f" font-weight="bold">startMismatch</text>
  <text x="515" y="86" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="700" y="46" width="210" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="805" y="68" text-anchor="middle" fill="#24292f" font-weight="bold">startHeld</text>
  <text x="805" y="86" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 15 s</text>

  <!-- stop direction: proven running, not commanded -->
  <rect x="420" y="286" width="190" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="515" y="308" text-anchor="middle" fill="#24292f" font-weight="bold">stopMismatch</text>
  <text x="515" y="326" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

  <rect x="700" y="286" width="210" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="805" y="308" text-anchor="middle" fill="#24292f" font-weight="bold">stopHeld</text>
  <text x="805" y="326" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 15 s</text>

  <!-- join -->
  <rect x="1000" y="166" width="180" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="1090" y="188" text-anchor="middle" fill="#24292f" font-weight="bold">anyProofFail</text>
  <text x="1090" y="206" text-anchor="middle" fill="#57606a" font-size="11">Logical.Or</text>

  <!-- boundary outputs: the alarm, plus the two direction flags -->
  <rect x="956" y="8" width="140" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1026" y="27" text-anchor="middle" fill="#7f1d1d">yFailToStart</text>

  <rect x="956" y="360" width="160" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1036" y="379" text-anchor="middle" fill="#7f1d1d">yUnexpectedRun</text>

  <rect x="1246" y="178" width="80" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1286" y="197" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 122 75 H 398 V 59 H 416"/>
    <path d="M 122 75 H 160 V 253 H 196"/>
    <path d="M 122 295 H 398 V 299 H 416"/>
    <path d="M 122 295 H 178 V 153 H 196"/>
    <path d="M 330 153 H 380 V 87 H 416"/>
    <path d="M 330 253 H 380 V 327 H 416"/>
    <path d="M 610 73 H 696"/>
    <path d="M 610 313 H 696"/>
    <path d="M 910 73 H 936 V 23 H 952"/>
    <path d="M 910 73 H 976 V 179 H 996"/>
    <path d="M 910 313 H 936 V 375 H 952"/>
    <path d="M 910 313 H 976 V 207 H 996"/>
    <path d="M 1180 193 H 1242"/>
  </g>

  <!-- port hints where two wires meet one block -->
  <g fill="#7d8590" font-size="9">
    <text x="396" y="56">u1</text>
    <text x="396" y="102">u2</text>
    <text x="396" y="296">u1</text>
    <text x="396" y="342">u2</text>
    <text x="976" y="176">u1</text>
    <text x="976" y="222">u2</text>
  </g>

  <g fill="#7d8590" font-size="10">
    <text x="616" y="66">Bool</text>
    <text x="616" y="306">Bool</text>
    <text x="1186" y="186">Bool</text>
  </g>

  <text x="200" y="418" fill="#7d8590" font-size="11">Each direction sustains on its own branch and its own published proof time, so a healthy start (or coast-down) inside the window never asserts.</text>
  <text x="200" y="436" fill="#7d8590" font-size="11">The two Ands cannot be true on the same tick, so the flags are mutually exclusive by construction; the Or is only a roll-up.</text>
</svg>
