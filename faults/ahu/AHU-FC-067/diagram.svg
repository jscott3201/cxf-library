<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <rect x="12" y="18" width="86" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="37" text-anchor="middle" fill="#1e3a8a">sat</text>

  <rect x="12" y="78" width="86" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="55" y="97" text-anchor="middle" fill="#1e3a8a" font-size="12">sat_sp</text>

  <!-- spGap -->
  <rect x="180" y="36" width="170" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="265" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">spGap</text>
  <text x="265" y="76" text-anchor="middle" fill="#57606a" font-size="11">Subtract · sat − sat_sp</text>

  <!-- absGap -->
  <rect x="390" y="36" width="110" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="445" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">absGap</text>
  <text x="445" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

  <!-- gapBig -->
  <rect x="540" y="36" width="230" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="655" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">gapBig</text>
  <text x="655" y="76" text-anchor="middle" fill="#57606a" font-size="11">GreaterThreshold · t = 1.7 °C</text>

  <!-- persist -->
  <rect x="790" y="36" width="86" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="833" y="55" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="833" y="71" text-anchor="middle" fill="#57606a" font-size="10">TrueDelay</text>
  <text x="833" y="84" text-anchor="middle" fill="#57606a" font-size="10">3600 s</text>

  <!-- boundary output -->
  <rect x="900" y="48" width="62" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="931" y="67" text-anchor="middle" fill="#7f1d1d" font-size="11">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 98 33 H 140 V 51 H 178"/>
    <path d="M 98 93 H 140 V 75 H 178"/>
    <path d="M 350 63 H 388"/>
    <path d="M 500 63 H 538"/>
    <path d="M 770 63 H 788"/>
    <path d="M 876 63 H 898"/>
  </g>

  <text x="160" y="44" text-anchor="middle" fill="#57606a" font-size="10">u1</text>
  <text x="160" y="93" text-anchor="middle" fill="#57606a" font-size="10">u2</text>
</svg>
