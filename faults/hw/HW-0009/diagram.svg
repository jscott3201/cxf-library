  <text x="1400" y="63" text-anchor="middle" fill="#7f1d1d">yFailToStart</text>
  <rect x="1330" y="134" width="90" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1375" y="153" text-anchor="middle" fill="#7f1d1d">yFault</text>
  <rect x="1330" y="224" width="155" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
