<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs (ROLE points) -->
  <rect x="12" y="80" width="130" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
