  <text x="250" y="300" fill="#7d8590" font-size="11">The baseline is host-fitted over a known-clean window (points contract). A fouling coil holds its duty by opening the valve, so the excess is the observable.</text>
  <text x="250" y="318" fill="#7d8590" font-size="11">inCtrl is an evaluability flag: false means the loop is not compensating and yFault says nothing. Both comparisons are strict; the fan gate is host-side.</text>
