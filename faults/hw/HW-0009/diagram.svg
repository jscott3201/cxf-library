  <text x="355" y="70" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>
  <rect x="520" y="30" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="605" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">startMiss</text>
  <text x="605" y="70" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  <rect x="770" y="30" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="870" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">startProof</text>
  <text x="870" y="70" text-anchor="middle" fill="#57606a" font-size="11">Logical.TrueDelay · 300 s</text>

  <rect x="270" y="210" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="355" y="232" text-anchor="middle" fill="#24292f" font-weight="bold">notCmd</text>
  <text x="355" y="250" text-anchor="middle" fill="#57606a" font-size="11">Logical.Not</text>
  <rect x="520" y="210" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="605" y="232" text-anchor="middle" fill="#24292f" font-weight="bold">stopMiss</text>
  <text x="605" y="250" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>
  <rect x="770" y="210" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="870" y="232" text-anchor="middle" fill="#24292f" font-weight="bold">stopProof</text>
  <text x="870" y="250" text-anchor="middle" fill="#57606a" font-size="11">Logical.TrueDelay · 120 s</text>

  <rect x="1080" y="120" width="170" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
