<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="20" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="39" text-anchor="middle" fill="#1e3a8a">sat</text>
    <rect x="12" y="90" width="138" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="81" y="109" text-anchor="middle" fill="#1e3a8a">mat</text>
  </g>

  <!-- rise and threshold blocks -->
  <g>
    <rect x="190" y="36" width="230" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="305" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">rise</text>
    <text x="305" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract · sat − mat</text>

    <rect x="470" y="36" width="250" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="595" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">riseBig</text>
    <text x="595" y="76" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 4.1623 °C</text>
  </g>

  <!-- persistence -->
  <rect x="770" y="36" width="168" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="854" y="58" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="854" y="76" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="990" y="50" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1024" y="69" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 150 35 H 170 V 51 H 186"/>
    <path d="M 150 105 H 170 V 79 H 186"/>

    <path d="M 420 65 H 466"/>
    <path d="M 720 65 H 766"/>
    <path d="M 938 65 H 986"/>
  </g>

  <!-- port and signal hints -->
  <text x="176" y="46" fill="#7d8590" font-size="10">u1</text>
  <text x="176" y="92" fill="#7d8590" font-size="10">u2</text>
  <text x="158" y="14" fill="#7d8590" font-size="10">Real</text>
  <text x="732" y="58" fill="#7d8590" font-size="10">Bool</text>
</svg>
