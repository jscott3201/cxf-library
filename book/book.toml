[book]
title = "open-control-library — CDL Fault Rule Library"
authors = ["Justin Scott"]
description = "Engine-verified CDL fault detection rules for the open-control engine, grounded in ASHRAE Guideline 36 and the HVAC FDD Reference."
src = "src"
language = "en"

[build]
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jscott3201/open-control-library"
site-url = "/open-control-library/"

[output.html.search]
enable = true
limit-results = 20

[output.html.fold]
enable = true
level = 1
