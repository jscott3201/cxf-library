<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary inputs -->
  <g>
    <rect x="12" y="30" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="49" text-anchor="middle" fill="#1e3a8a">mat</text>
    <rect x="12" y="100" width="120" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="72" y="119" text-anchor="middle" fill="#1e3a8a">sat</text>
  </g>

  <!-- gap, threshold, persistence -->
  <rect x="200" y="53" width="200" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="300" y="75" text-anchor="middle" fill="#24292f" font-weight="bold">gap</text>
  <text x="300" y="93" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract · mat − sat</text>

  <rect x="450" y="53" width="240" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="570" y="75" text-anchor="middle" fill="#24292f" font-weight="bold">gapBig</text>
  <text x="570" y="93" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 3 °C</text>

  <rect x="740" y="53" width="160" height="54" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="820" y="75" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
  <text x="820" y="93" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 1800 s</text>

  <!-- boundary output -->
  <rect x="940" y="65" width="68" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="974" y="84" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 132 45 H 168 V 67 H 196"/>
    <path d="M 132 115 H 168 V 93 H 196"/>
    <path d="M 400 80 H 446"/>
    <path d="M 690 80 H 736"/>
    <path d="M 900 80 H 936"/>
  </g>

  <!-- port and signal hints -->
  <text x="174" y="62" fill="#7d8590" font-size="10">u1</text>
  <text x="174" y="108" fill="#7d8590" font-size="10">u2</text>
  <text x="702" y="73" fill="#7d8590" font-size="10">Bool</text>
</svg>
