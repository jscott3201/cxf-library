  <text x="270" y="322" fill="#7d8590" font-size="11">Every signal is Boolean. The two And gates are mutually exclusive by construction, so yFailToStart and yUnexpectedRun can never be true on the same tick.</text>
  <text x="270" y="340" fill="#7d8590" font-size="11">delayOnInit = true on both delays: a restart serves the full window before either direction asserts. Composed from elementary blocks, not CDL Logical.Proof — see Deviations.</text>
</svg>
