<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2540 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <!-- boundary input -->
  <rect x="12" y="196" width="170" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="97" y="215" text-anchor="middle" fill="#1e3a8a">zone_dmpr_pos</text>

  <!-- rolling mean: the spine both tests share -->
  <rect x="240" y="182" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="340" y="204" text-anchor="middle" fill="#24292f" font-weight="bold">muS</text>
  <text x="340" y="222" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 1800 s</text>

  <!-- mean-crossing counting chain -->
  <g>
    <rect x="500" y="30" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="565" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">above</text>
    <text x="565" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.Greater</text>

    <rect x="660" y="30" width="150" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="735" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">flip</text>
    <text x="735" y="70" text-anchor="middle" fill="#57606a" font-size="11">Logical.Change</text>

    <rect x="840" y="30" width="195" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="937" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">pulseInt</text>
    <text x="937" y="70" text-anchor="middle" fill="#57606a" font-size="11">Conversions.BooleanToInteger</text>

    <rect x="1065" y="30" width="185" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1157" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">pulseReal</text>
    <text x="1157" y="70" text-anchor="middle" fill="#57606a" font-size="11">Conversions.IntegerToReal</text>

    <rect x="1280" y="30" width="195" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1377" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">xRate</text>
    <text x="1377" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 1800 s</text>

    <rect x="1505" y="30" width="235" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1622" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">xCount</text>
    <text x="1622" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.MultiplyByParameter · k = 30</text>

    <rect x="1770" y="30" width="215" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1877" y="52" text-anchor="middle" fill="#24292f" font-weight="bold">xHigh</text>
    <text x="1877" y="70" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 10</text>
  </g>

  <!-- amplitude (MAD) chain -->
  <g>
    <rect x="500" y="330" width="140" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="570" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">dev</text>
    <text x="570" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.Subtract</text>

    <rect x="680" y="330" width="120" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="740" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">absDev</text>
    <text x="740" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.Abs</text>

    <rect x="840" y="330" width="195" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="937" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">mad</text>
    <text x="937" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.MovingAverage · 1800 s</text>

    <rect x="1075" y="330" width="215" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1182" y="352" text-anchor="middle" fill="#24292f" font-weight="bold">madHigh</text>
    <text x="1182" y="370" text-anchor="middle" fill="#57606a" font-size="11">Reals.GreaterThreshold · t = 5</text>
  </g>

  <!-- conjunction and alarm chain -->
  <g>
    <rect x="2030" y="182" width="130" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="2095" y="204" text-anchor="middle" fill="#24292f" font-weight="bold">both</text>
    <text x="2095" y="222" text-anchor="middle" fill="#57606a" font-size="11">Logical.And</text>

    <rect x="2200" y="182" width="180" height="58" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="2290" y="204" text-anchor="middle" fill="#24292f" font-weight="bold">persist</text>
    <text x="2290" y="222" text-anchor="middle" fill="#57606a" font-size="11">TrueDelay · 900 s</text>
  </g>

  <!-- boundary output -->
  <rect x="2420" y="196" width="110" height="30" rx="15" fill="#fee2e2" stroke="#dc2626"/>
  <text x="2475" y="215" text-anchor="middle" fill="#7f1d1d">yFault</text>

  <!-- fan-out junctions: the position feeds three places, the mean two -->
  <circle cx="205" cy="211" r="3" fill="#7d8590"/>
  <circle cx="465" cy="211" r="3" fill="#7d8590"/>
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <path d="M 182 211 H 205"/>
    <path d="M 440 211 H 465"/>
  </g>

  <!-- wires -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 205 211 H 236"/>
    <path d="M 205 211 V 14 H 480 V 45 H 496"/>
    <path d="M 205 211 V 408 H 480 V 345 H 496"/>

    <path d="M 465 211 V 73 H 496"/>
    <path d="M 465 211 V 373 H 496"/>

    <path d="M 630 59 H 656"/>
    <path d="M 810 59 H 836"/>
    <path d="M 1035 59 H 1061"/>
    <path d="M 1250 59 H 1276"/>
    <path d="M 1475 59 H 1501"/>
    <path d="M 1740 59 H 1766"/>
    <path d="M 1985 59 H 1995 V 197 H 2026"/>

    <path d="M 640 359 H 676"/>
    <path d="M 800 359 H 836"/>
    <path d="M 1035 359 H 1071"/>
    <path d="M 1290 359 H 2010 V 225 H 2026"/>

    <path d="M 2160 211 H 2196"/>
    <path d="M 2380 211 H 2416"/>
  </g>

  <!-- port hints where operand order matters -->
  <g fill="#7d8590" font-size="9">
    <text x="504" y="43">u1</text>
    <text x="504" y="78">u2</text>
    <text x="504" y="343">u1</text>
    <text x="504" y="378">u2</text>
    <text x="2034" y="195">u1</text>
    <text x="2034" y="230">u2</text>
  </g>

  <!-- signal type hints -->
  <text x="150" y="190" fill="#7d8590" font-size="10">Real</text>
  <text x="636" y="46" fill="#7d8590" font-size="10">Bool</text>
  <text x="1041" y="46" fill="#7d8590" font-size="10">Int</text>
  <text x="1256" y="46" fill="#7d8590" font-size="10">Real</text>
  <text x="1991" y="46" fill="#7d8590" font-size="10">Bool</text>
  <text x="1296" y="346" fill="#7d8590" font-size="10">Bool</text>
</svg>
